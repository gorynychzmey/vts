# VTS production pod (vts-0pg). Played by systemd/vts.service via
# `podman kube play`. Host copy lives at /opt/vts/vts.yaml.
#
# Secrets are NOT in this file: every container reads /opt/vts/config/vts.env
# from the host. Do not add a ConfigMap with credentials here.
apiVersion: v1
kind: Pod
metadata:
  name: vts
  annotations:
    # Same policy the old units carried as a --label.
    io.containers.autoupdate/webapi: "registry"
    io.containers.autoupdate/worker: "registry"
spec:
  restartPolicy: Always
  # initContainers run to completion, in order, before webapi/worker start.
  initContainers:
    - name: migrate
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: migrate
      envFrom:
        - configMapRef:
            name: vts-env
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
    # Installs delivery adapter plugins into /opt/vts/state/plugins/site,
    # which webapi and worker carry on their PYTHONPATH (vts-j8gz). Writes to
    # the shared opt-vts volume, so no extra volume is needed.
    #
    # Exits 0 on an unreachable GitHub by design: a failing initContainer
    # would stop the pod, so a network blip would cost transcription over a
    # delivery feature. The containers then start with whatever is cached.
    - name: plugins
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: plugins
      envFrom:
        - configMapRef:
            name: vts-env
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
  containers:
    - name: webapi
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: webapi
        # The migrate initContainer above has already applied migrations, and in
        # a pod webapi and worker start in parallel. Outside a pod webapi still
        # migrates by default — that is what keeps the two-unit topology working
        # while both exist.
        - name: VTS_SKIP_MIGRATIONS
          value: "1"
        # Where the plugins initContainer installs adapter wheels. Without
        # this the entry-point discovery finds nothing and every delivery
        # target reports its adapter as unavailable.
        - name: PYTHONPATH
          value: /opt/vts/state/plugins/site
      envFrom:
        - configMapRef:
            name: vts-env
      ports:
        - containerPort: 8080
          hostPort: 8086
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
    - name: worker
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: worker
        # The worker is what actually runs deliveries, so it needs the
        # adapters on its path just as much as webapi does.
        - name: PYTHONPATH
          value: /opt/vts/state/plugins/site
      envFrom:
        - configMapRef:
            name: vts-env
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
  volumes:
    - name: opt-vts
      hostPath:
        path: /opt/vts
        type: Directory
    - name: vts-data
      hostPath:
        path: /disk/vts-data
        type: Directory
