# VTS production pod (vts-0pg). Played by systemd/vts.service via
# `podman kube play`. Host copy lives at /opt/vts/vts.yaml.
#
# Secrets are NOT in this file: every container reads /opt/vts/config/vts.env
# from the host. Do not add a ConfigMap with credentials here.
apiVersion: v1
kind: Pod
metadata:
  name: vts
  annotations:
    # Same policy the old units carried as a --label.
    io.containers.autoupdate/webapi: "registry"
    io.containers.autoupdate/worker: "registry"
spec:
  restartPolicy: Always
  # Migrations run to completion before webapi/worker start. This is the whole
  # reason the pod exists ahead of the plugin loader (vts-9y7), whose bootstrap
  # will become a second initContainer right here.
  initContainers:
    - name: migrate
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: migrate
      envFrom:
        - configMapRef:
            name: vts-env
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
  containers:
    - name: webapi
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: webapi
        # The migrate initContainer above has already applied migrations, and in
        # a pod webapi and worker start in parallel. Outside a pod webapi still
        # migrates by default — that is what keeps the two-unit topology working
        # while both exist.
        - name: VTS_SKIP_MIGRATIONS
          value: "1"
      envFrom:
        - configMapRef:
            name: vts-env
      ports:
        - containerPort: 8080
          hostPort: 8086
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
    - name: worker
      image: ghcr.io/gorynychzmey/vts:latest
      env:
        - name: VTS_ROLE
          value: worker
      envFrom:
        - configMapRef:
            name: vts-env
      volumeMounts:
        - name: opt-vts
          mountPath: /opt/vts
        - name: vts-data
          mountPath: /srv/vts-data
  volumes:
    - name: opt-vts
      hostPath:
        path: /opt/vts
        type: Directory
    - name: vts-data
      hostPath:
        path: /disk/vts-data
        type: Directory
