name: Build Images

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version in semver format X.Y.Z (optional for manual run)"
        required: false
        default: ""
      dockerhub_image_repo:
        description: "Docker Hub image repository (e.g. docker.io/<owner>/vts). Leave empty to skip Docker Hub mirror."
        required: false
        default: ""
      ghcr_image_repo:
        description: "GHCR image repository (e.g. ghcr.io/<owner>/vts)"
        required: false
        default: ""
  push:
    tags:
      - "build-*"

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on a dependency audit (vts-7to).
  #
  # tests.yml also runs pip-audit, but only on push/PR to main — and a release
  # is a `build-X.Y.Z` TAG, which those triggers never match. So the two never
  # overlapped, and a build whose audit was red could be (and was) shipped:
  # cryptography 46.0.7 with GHSA-537c-gmf6-5ccf (HIGH) reached prod on three
  # consecutive releases while "Build Images" and "Deploy After Build" were
  # both green.
  #
  # Duplicated here rather than read across workflows on purpose: a
  # cross-workflow status lookup would pass when tests.yml simply had not run
  # for this commit, which is exactly the hole being closed.
  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime requirements for known vulnerabilities
        # Keep this in step with the identical step in tests.yml — including
        # any --ignore-vuln entries, or a release would block on a CVE that
        # main has already triaged.
        run: pip-audit --strict --requirement requirements.txt

  build:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release on tag builds
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-cliff needs full history + tags to compute the changelog.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image repositories
        id: repos
        shell: bash
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          dockerhub_input="${{ github.event.inputs.dockerhub_image_repo || '' }}"
          ghcr_input="${{ github.event.inputs.ghcr_image_repo || '' }}"
          dockerhub_var="${{ vars.DOCKERHUB_IMAGE_REPO || '' }}"
          ghcr_var="${{ vars.GHCR_IMAGE_REPO || '' }}"
          build_version_input="${{ github.event.inputs.build_version || '' }}"

          # Docker Hub mirror is optional — empty repo disables the mirror step.
          # Set repository var DOCKERHUB_IMAGE_REPO (e.g. docker.io/<owner>/vts)
          # or pass dockerhub_image_repo input to enable.
          if [[ -n "${dockerhub_input}" ]]; then
            dockerhub_repo="${dockerhub_input}"
          elif [[ -n "${dockerhub_var}" ]]; then
            dockerhub_repo="${dockerhub_var}"
          else
            dockerhub_repo=""
          fi

          if [[ -n "${ghcr_input}" ]]; then
            ghcr_repo="${ghcr_input}"
          elif [[ -n "${ghcr_var}" ]]; then
            ghcr_repo="${ghcr_var}"
          else
            ghcr_repo="ghcr.io/${owner_lc}/vts"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == build-* ]]; then
            version="${GITHUB_REF_NAME#build-}"
          elif [[ -n "${build_version_input}" ]]; then
            version="${build_version_input}"
          else
            version="$(python scripts/get_version.py)"
          fi

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid build version '${version}'. Expected semver X.Y.Z."
            exit 1
          fi

          echo "dockerhub_repo=${dockerhub_repo}" >>"${GITHUB_OUTPUT}"
          echo "ghcr_repo=${ghcr_repo}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "Using Docker Hub repo: ${dockerhub_repo}"
          echo "Using GHCR repo: ${ghcr_repo}"
          echo "Version: ${version}"

      - name: Validate Docker Hub secrets
        if: steps.repos.outputs.dockerhub_repo != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" || -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required when a Docker Hub repo is configured."
            exit 1
          fi

      - name: Login to Docker Hub
        if: steps.repos.outputs.dockerhub_repo != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test, and push images to GHCR
        shell: bash
        env:
          CONTAINER_ENGINE: docker
          USE_BUILDX: auto
          BUILDX_CACHE_REPO: ${{ steps.repos.outputs.ghcr_repo }}
          BUILDX_CACHE_MODE: max
          IMAGE_REPO: ${{ steps.repos.outputs.ghcr_repo }}
          VERSION_OVERRIDE: ${{ steps.repos.outputs.version }}
        run: |
          set -euo pipefail
          bash ./build.sh

      - name: Mirror GHCR images to Docker Hub
        if: steps.repos.outputs.dockerhub_repo != ''
        shell: bash
        env:
          DOCKERHUB_REPO: ${{ steps.repos.outputs.dockerhub_repo }}
          GHCR_REPO: ${{ steps.repos.outputs.ghcr_repo }}
          VERSION: ${{ steps.repos.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "${GHCR_REPO}:${VERSION}" "${DOCKERHUB_REPO}:${VERSION}"
          docker tag "${GHCR_REPO}:latest" "${DOCKERHUB_REPO}:latest"
          docker push "${DOCKERHUB_REPO}:${VERSION}"
          docker push "${DOCKERHUB_REPO}:latest"

      # ── GitHub Release (only on build-* tag pushes) ──────────────────────
      - name: Generate changelog with git-cliff
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build-')
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --latest = render only the section for the tag being built.
          # --strip header keeps the body clean (no top-level "Changelog" heading).
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.repos.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.content }}

            ## Container images

            ```
            docker pull ${{ steps.repos.outputs.ghcr_repo }}:${{ steps.repos.outputs.version }}
            docker pull ${{ steps.repos.outputs.ghcr_repo }}:latest
            ```

            See [docs/INITIAL_DEPLOYMENT.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INITIAL_DEPLOYMENT.md) for production deployment instructions.
          draft: false
          prerelease: false
          make_latest: "true"
