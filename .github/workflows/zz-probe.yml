name: Probe cross-repo dispatch
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try dispatching to vts-plugins with the built-in GITHUB_TOKEN
        continue-on-error: true
        run: |
          code=$(curl -o /tmp/body.txt -w '%{http_code}' -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/gorynychzmey/vts-plugins/dispatches \
            -d '{"event_type":"probe-builtin-token"}')
          echo "HTTP $code"
          cat /tmp/body.txt
