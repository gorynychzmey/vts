name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      # The cluster superuser is `postgres`; the `vts` role tests connect as is
      # created unprivileged in the "Provision test database" step below, so CI
      # has the same privilege shape as production (vts-e1p).
      postgres:
        image: tensorchord/vchord-postgres:pg17-v1.1.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Mirrors scripts/pg-init-app-role.sh: an unprivileged app role plus
      # superuser-installed extensions. Tests must not be able to CREATE
      # EXTENSION themselves — that privilege gap is what this guards.
      - name: Provision test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vts LOGIN PASSWORD 'vts'" \
            -c "CREATE DATABASE vts_test OWNER vts"
          psql -h localhost -U postgres -d vts_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d vts_test -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'vts'" | grep -qx f \
            || { echo "app role 'vts' must not be a superuser"; exit 1; }

      - name: Run tests
        env:
          VTS_TEST_DATABASE_URL: postgresql+asyncpg://vts:vts@localhost:5432/vts_test
        run: python -m pytest -q

  # Cheap gate (~10s) so the browser suite only runs when the frontend actually
  # changed. A job-level `paths:` filter does not exist — `paths` is a
  # workflow-level trigger filter only — so the decision is computed here and
  # consumed via `needs`/`if`. Deliberately a few lines of git rather than a
  # third-party action: this workflow gates releases, and an external action is
  # a supply-chain dependency in that path (vts-9bcu).
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need history to diff against the base; 0 = full clone. The repo is
          # small enough that this costs a couple of seconds.
          fetch-depth: 0

      - name: Decide whether the UI suite must run
        id: filter
        env:
          # For a PR, compare against the target branch's merge base. For a push
          # to main, compare against the commit the push started from.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # `github.event.before` is all-zeroes on a branch's first push, and a
          # force-push can leave a base that is no longer reachable. In either
          # case we cannot compute a range, so fail OPEN and run the suite:
          # a needless 2-minute run is cheaper than a frontend regression that
          # CI silently skipped.
          if [ -z "${BASE_SHA:-}" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit unavailable — running the UI suite unconditionally"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${BASE_SHA}..${{ github.sha }}"
          changed=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "$changed" | sed 's/^/  /'

          # tests/ui/** is included so a change to the harness or a scenario is
          # itself verified, not just changes to the app it drives.
          if echo "$changed" | grep -qE '^(vts/static/|tests/ui/)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  ui:
    name: Browser UI verifier
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install dependencies
        working-directory: tests/ui
        run: npm ci

      # harness.mjs calls chromium.launch() with no channel, so Playwright uses
      # the headless shell (~262MB) rather than full Chrome (~379MB). Installing
      # only that keeps the cold path meaningfully smaller.
      - name: Resolve Playwright version
        id: pw
        working-directory: tests/ui
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-headless-shell

      - name: Install Chromium headless shell
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/ui
        run: npx playwright install --with-deps chromium-headless-shell

      # System libraries are not part of the cached browser directory, so they
      # must be installed even on a cache hit.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests/ui
        run: npx playwright install-deps chromium-headless-shell

      # Proves the harness can still detect a planted regression. A green suite
      # from a harness that cannot fail is worth nothing, so this guards the
      # guard itself and must run before the suite is believed.
      - name: Self-check (harness is not a rubber stamp)
        working-directory: tests/ui
        run: node self-check.mjs

      - name: Run UI scenarios
        working-directory: tests/ui
        run: node run.mjs

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: /tmp/vts-ui-verify/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime requirements for known vulnerabilities
        # --strict makes pip-audit exit non-zero on resolution errors too,
        # not just on found vulnerabilities — catches situations where the
        # requirements file no longer resolves cleanly.
        # If a CVE is published before a fix exists upstream, add a one-line
        # `--ignore-vuln <ID>` here with a comment pointing at the tracking
        # issue, rather than blocking the whole pipeline.
        #
        # Retried because pip-audit queries the PyPI API once PER DEPENDENCY:
        # a single connection reset anywhere in that sequence kills the whole
        # run, and it took the build down on 2026-08-18 with a
        # ConnectionResetError and no vulnerability involved. The retry covers
        # ONLY that transport failure — a real finding fails identically on
        # every attempt, so this cannot hide one.
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            # `status` must be captured from the command itself, not after an
            # `if` — inside the branch $? is the IF's status (always 0) and the
            # warning would report a misleading "exit 0" for a real failure.
            pip-audit --strict --requirement requirements.txt && exit 0
            status=$?
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::pip-audit attempt $attempt failed (exit $status); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::pip-audit failed on all 3 attempts — treat as a real finding, not a network blip"
          exit 1
