name: Notify plugins of a contract change

# The delivery contract is a public interface: plugins live in
# gorynychzmey/vts-plugins, are built against it, and are bound to `latest`
# at load time. A change here can therefore break a plugin that nobody
# rebuilt — and the failure would surface in production as a delivery that
# stops working, not as a red build.
#
# So: whenever the contract module moves, tell the plugin repo to re-run its
# tests against the new contract. Fires on MAJOR or MINOR alike — a trigger
# limited to major would automate the least useful case (a foreign major is
# refused at load time anyway, with a stated reason) and miss the dangerous
# one: a breaking change shipped under a minor bump.
on:
  push:
    branches: [main]
    paths:
      - "vts/delivery/contract.py"
      - "packages/vts-delivery-contract/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the contract version being published
        id: contract
        run: |
          version=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path("vts/delivery/contract.py").read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  getattr(t, "id", "") == "CONTRACT_VERSION" for t in node.targets
              ):
                  print(".".join(str(v) for v in ast.literal_eval(node.value)))
                  break
          else:
              raise SystemExit("CONTRACT_VERSION not found in the contract module")
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "contract version: $version"

      - name: Ask vts-plugins to re-test against it
        env:
          # A PAT with `repo` scope on gorynychzmey/vts-plugins. The default
          # GITHUB_TOKEN is scoped to THIS repository and cannot dispatch to
          # another one, so without this secret the step is skipped rather
          # than failing every contract change.
          TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::warning::PLUGINS_DISPATCH_TOKEN is not set — vts-plugins was NOT notified of contract ${{ steps.contract.outputs.version }}. Add the secret to close the loop."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/gorynychzmey/vts-plugins/dispatches \
            -d @- <<JSON
          {
            "event_type": "contract-changed",
            "client_payload": {
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "contract_version": "${{ steps.contract.outputs.version }}"
            }
          }
          JSON
          echo "notified vts-plugins: contract ${{ steps.contract.outputs.version }}"
