name: CLA

# Asks first-time contributors to sign CLA.md and records signatures in the
# `cla-signatures` branch. The action does not create that branch: it must
# exist (an orphan branch holding only the signature file) and stay unprotected.
#
# pull_request_target runs in the context of the base repository, so the token
# can write the signature file even for pull requests from forks. That is safe
# here only because this workflow never checks out or executes code from the
# pull request; keep it that way.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: gorynychzmey,dependabot[bot],github-actions[bot],claude[bot]
          lock-pullrequest-aftermerge: false
